name: CI

on:
  pull_request:
  push:
    branches: [deploy1.1, NEX, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint (report only until existing errors are fixed)
        run: npm run lint:check
        continue-on-error: true
      - run: npm run build
      - run: npx jest --ci
      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy --schema=./src/prisma/schema.prisma

  admin-portal:
    name: Admin portal (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-portal
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_BACKEND_URL: https://api.example.com
      NEXT_PUBLIC_STOREFRONT_URL: https://example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - run: npm ci
      - name: Lint (report only until existing errors are fixed)
        run: npm run lint
        continue-on-error: true
      - run: npm run build

  storefront:
    name: Storefront (build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND_URL: https://api.example.com
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_ADMIN_URL: https://admin.example.com
      NEXT_PUBLIC_DEV_MODE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Production Docker images build
    runs-on: ubuntu-latest
    env:
      # Placeholder values so compose can resolve required variables; nothing is deployed.
      SITE_DOMAIN: example.com
      ADMIN_DOMAIN: admin.example.com
      API_DOMAIN: api.example.com
      FRONTEND_URL: https://example.com
      ADMIN_URL: https://admin.example.com
      BACKEND_PUBLIC_URL: https://api.example.com
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      REDIS_PASSWORD: ci
      JWT_SECRET: ci
      JWT_REFRESH_SECRET: ci
      REVALIDATE_SECRET: ci
      RAZORPAY_KEY_ID: rzp_test_ci
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: |
          touch .env
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend, storefront and admin-portal images
        run: docker compose -f docker-compose.prod.yml build backend storefront admin-portal
