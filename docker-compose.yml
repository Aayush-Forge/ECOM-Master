services:
  postgres:
    image: postgres:15-alpine
    container_name: sridattam_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sridattam_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sridattam_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sridattam_dev_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sridattam_admin} -d ${POSTGRES_DB:-sridattam_dev_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sridattam_network

  redis:
    image: redis:7-alpine
    container_name: sridattam_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sridattam_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sridattam_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-sridattam_admin}:${POSTGRES_PASSWORD:-sridattam_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-sridattam_dev_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_1234567890}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_key_1234567890}
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      EMAIL_PROVIDER: console
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TeDsxH8VAgL0ZA}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-test_razorpay_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - sridattam_network

  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
      target: development
    container_name: sridattam_admin_portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./admin-portal/app:/app/app
      - ./admin-portal/components:/app/components
      - ./admin-portal/lib:/app/lib
    networks:
      - sridattam_network

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sridattam_storefront
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
      NEXT_PUBLIC_DEV_MODE: "true"
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TeDsxH8VAgL0ZA}
    depends_on:
      - backend
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
    networks:
      - sridattam_network

volumes:
  postgres_data:
  redis_data:

networks:
  sridattam_network:
    driver: bridge
